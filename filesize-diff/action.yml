name: File size Diff Analysis
description: Analyze file size differences against the baseline branch, and comment on PRs with changes

inputs:
  directories:
    description: Comma-separated list of directories to analyze (e.g., api/dist,app/dist) (relative to workspace root)
    required: true

  ignore:
    description: Comma-separated glob patterns to leave out of the analysis, relative to each directory (e.g. '**/*.map')
    required: false
    default: ''

  cache-path:
    description: Path to cache directory
    required: false
    default: .github/cache/build-stats

  cache-key:
    description: Cache key prefix. The baseline branch and commit are appended to it, so do not name a branch here.
    required: false
    default: build-stats

  comment-on-pr:
    description: Whether to comment on PRs with file size changes
    required: false
    default: 'true'

  github-token:
    description: GitHub token for API calls (defaults to github.token)
    required: false
    default: ${{ github.token }}

outputs:
  has-changes:
    description: Whether any file size changes were detected against the baseline (true also when no baseline was found)

runs:
  using: node24
  main: dist/run.js
